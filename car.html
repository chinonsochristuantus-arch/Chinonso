<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richie Store — Cars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F68B1E;
    --orange-dark:#E17A0E;
    --navy:#0F1724;
    --gray-900:#1A1D22;
    --gray-600:#6B7280;
    --gray-400:#9AA1AC;
    --gray-300:#E1E4E8;
    --gray-100:#F7F8FA;
    --white:#FFFFFF;
    --green:#1E8E4F;
    --error:#D64545;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Inter', sans-serif;
    background:var(--gray-100);
    color:var(--gray-900);
    min-height:100vh;
  }

  a{ color:inherit; }
  button{ font-family:inherit; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  .topbar{
    background:var(--white);
    border-bottom:1px solid var(--gray-300);
    padding:14px 32px;
    display:flex;
    align-items:center;
    gap:24px;
    position:sticky;
    top:0;
    z-index:40;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--gray-900);
    text-decoration:none;
    flex-shrink:0;
  }

  .logo .mark{
    width:30px;
    height:30px;
    background:var(--orange);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--white);
    font-size:16px;
    font-weight:700;
  }

  .logo .store{ color:var(--orange); }

  .search-bar{
    flex:1;
    display:flex;
    max-width:640px;
  }

  .search-bar input{
    flex:1;
    border:1.5px solid var(--gray-300);
    border-right:none;
    border-radius:6px 0 0 6px;
    padding:10px 14px;
    font-size:14px;
    outline:none;
    font-family:'Inter', sans-serif;
  }

  .search-bar input:focus{ border-color:var(--orange); }

  .search-bar button{
    background:var(--orange);
    border:none;
    color:var(--white);
    padding:0 18px;
    border-radius:0 6px 6px 0;
    cursor:pointer;
    font-size:15px;
  }

  .search-bar button:hover{ background:var(--orange-dark); }

  .top-actions{
    display:flex;
    align-items:center;
    gap:20px;
    margin-left:auto;
    flex-shrink:0;
  }

  .top-link{
    font-size:13.5px;
    font-weight:500;
    text-decoration:none;
    color:var(--gray-900);
    white-space:nowrap;
  }
  .top-link:hover{ color:var(--orange); }

  .cart-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--gray-900);
  }

  .cart-btn:hover{ color:var(--orange); }

  .cart-icon{ font-size:19px; position:relative; }

  .cart-count{
    position:absolute;
    top:-8px;
    right:-10px;
    background:var(--orange);
    color:var(--white);
    font-size:10.5px;
    font-weight:700;
    min-width:17px;
    height:17px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
  }

  .breadcrumb{
    max-width:1240px;
    margin:0 auto;
    padding:16px 32px 0;
    font-size:12.5px;
    color:var(--gray-600);
  }
  .breadcrumb span.current{ color:var(--gray-900); font-weight:500; }

  .page{
    max-width:1240px;
    margin:0 auto;
    padding:16px 32px 64px;
    display:flex;
    gap:24px;
    align-items:flex-start;
  }

  .filters{
    flex:0 0 240px;
    background:var(--white);
    border:1px solid var(--gray-300);
    border-radius:8px;
    padding:20px;
    position:sticky;
    top:82px;
  }

  .filters h3{
    font-family:'Poppins', sans-serif;
    font-size:15px;
    margin-bottom:16px;
  }

  .filter-group{
    padding:16px 0;
    border-top:1px solid var(--gray-300);
  }
  .filter-group:first-of-type{ border-top:none; padding-top:0; }

  .filter-group h4{
    font-size:13px;
    font-weight:600;
    margin-bottom:12px;
    text-transform:uppercase;
    letter-spacing:0.3px;
    color:var(--gray-600);
  }

  .filter-option{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13.5px;
    margin-bottom:10px;
    cursor:pointer;
    color:var(--gray-900);
  }

  .filter-option input{
    width:15px; height:15px;
    accent-color:var(--orange);
    cursor:pointer;
  }

  .filter-option .count{ color:var(--gray-400); margin-left:auto; font-size:12px; }

  .price-inputs{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .price-inputs input{
    width:100%;
    border:1.5px solid var(--gray-300);
    border-radius:5px;
    padding:8px 9px;
    font-size:13px;
    outline:none;
  }
  .price-inputs input:focus{ border-color:var(--orange); }

  .apply-price{
    margin-top:10px;
    width:100%;
    background:var(--gray-900);
    color:var(--white);
    border:none;
    border-radius:5px;
    padding:9px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .apply-price:hover{ background:#000; }

  .clear-filters{
    margin-top:16px;
    width:100%;
    background:none;
    border:1.5px solid var(--gray-300);
    border-radius:5px;
    padding:9px;
    font-size:12.5px;
    font-weight:600;
    color:var(--gray-600);
    cursor:pointer;
  }
  .clear-filters:hover{ border-color:var(--gray-900); color:var(--gray-900); }

  .main-col{ flex:1; min-width:0; }

  .results-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border:1px solid var(--gray-300);
    border-radius:8px;
    padding:14px 18px;
    margin-bottom:18px;
  }

  .results-bar h1{
    font-family:'Poppins', sans-serif;
    font-size:17px;
    font-weight:600;
  }

  .results-bar .count{ font-weight:400; color:var(--gray-600); font-size:13.5px; margin-left:6px; }

  .sort-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
  }

  .sort-wrap select{
    border:1.5px solid var(--gray-300);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter', sans-serif;
    outline:none;
    cursor:pointer;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }

  .no-results{
    background:var(--white);
    border:1px solid var(--gray-300);
    border-radius:8px;
    padding:60px 20px;
    text-align:center;
    color:var(--gray-600);
    font-size:14px;
    grid-column:1 / -1;
  }

  .card{
    background:var(--white);
    border:1px solid var(--gray-300);
    border-radius:8px;
    padding:14px;
    display:flex;
    flex-direction:column;
    position:relative;
    transition:box-shadow .15s ease, border-color .15s ease;
  }

  .card:hover{ box-shadow:0 6px 18px rgba(15,23,36,0.08); border-color:var(--gray-300); }

  .badge{
    position:absolute;
    top:12px;
    left:12px;
    background:var(--orange);
    color:var(--white);
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:4px;
    z-index:2;
  }

  .card-img{
    width:100%;
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
    background:var(--gray-100);
    border-radius:6px;
    overflow:hidden;
  }

  .card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .card .brand{
    font-size:11px;
    font-weight:700;
    color:var(--gray-600);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:4px;
  }

  .card .name{
    font-size:13.5px;
    font-weight:500;
    line-height:1.4;
    margin-bottom:8px;
    min-height:38px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .rating-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
    font-size:12px;
  }

  .stars{ color:var(--orange); letter-spacing:1px; font-size:12.5px; }
  .rating-row .reviews{ color:var(--gray-400); }

  .price-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
    flex-wrap:wrap;
  }

  .price-now{ font-size:16px; font-weight:700; color:var(--gray-900); }
  .price-was{ font-size:12px; color:var(--gray-400); text-decoration:line-through; }

  .storage-tag{
    font-size:11px;
    color:var(--gray-600);
    margin-bottom:12px;
  }

  .add-btn{
    margin-top:auto;
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:6px;
    padding:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition: background .15s ease;
  }

  .add-btn:hover{ background:var(--orange-dark); }
  .add-btn.added{ background:var(--green); }

  @media (max-width: 1080px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }

  @media (max-width: 860px){
    .page{ flex-direction:column; }
    .filters{ position:static; flex:none; width:100%; }
    .grid{ grid-template-columns:repeat(1, 1fr); }
    .search-bar{ display:none; }
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns:repeat(1, 1fr); gap:10px; }
    .topbar{ padding:12px 16px; }
    .page{ padding:16px 16px 48px; }
    .top-actions{ gap:10px; }
    .top-link{ font-size:12px; }
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,36,0.45);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:400px;
    max-width:92vw;
    background:var(--white);
    z-index:61;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .25s ease;
  }
  .drawer.open{ transform:translateX(0); }

  .drawer-head{
    padding:18px 20px;
    border-bottom:1px solid var(--gray-300);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .drawer-head h2{ font-family:'Poppins', sans-serif; font-size:17px; }

  .drawer-close{
    background:none;
    border:none;
    font-size:20px;
    cursor:pointer;
    color:var(--gray-600);
    line-height:1;
  }
  .drawer-close:hover{ color:var(--gray-900); }

  .drawer-body{
    flex:1;
    overflow-y:auto;
    padding:14px 20px;
  }

  .cart-empty{
    text-align:center;
    color:var(--gray-600);
    font-size:13.5px;
    padding:60px 10px;
  }

  .cart-item{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--gray-300);
  }

  .cart-item img{
    width:76px;
    height:56px;
    object-fit:cover;
    border-radius:6px;
    background:var(--gray-100);
    flex-shrink:0;
  }

  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-info .name{ font-size:13px; font-weight:500; margin-bottom:4px; line-height:1.3; }
  .cart-item-info .price{ font-size:13px; font-weight:700; color:var(--gray-900); margin-bottom:8px; }

  .qty-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .qty-btn{
    width:24px; height:24px;
    border:1.5px solid var(--gray-300);
    background:var(--white);
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gray-900);
  }
  .qty-btn:hover{ border-color:var(--orange); color:var(--orange); }

  .qty-val{ font-size:13px; font-weight:600; min-width:16px; text-align:center; }

  .remove-btn{
    background:none;
    border:none;
    color:var(--error);
    font-size:12px;
    cursor:pointer;
    margin-left:auto;
    text-decoration:underline;
  }

  .drawer-footer{
    border-top:1px solid var(--gray-300);
    padding:16px 20px 20px;
  }

  .subtotal-row{
    display:flex;
    justify-content:space-between;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:14px;
  }

  .checkout-btn{
    width:100%;
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:6px;
    padding:13px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .checkout-btn:hover{ background:var(--orange-dark); }
  .checkout-btn:disabled{ background:var(--gray-300); cursor:not-allowed; }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,36,0.55);
    z-index:80;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }

  .modal{
    background:var(--white);
    border-radius:10px;
    max-width:380px;
    width:100%;
    padding:32px 28px;
    text-align:center;
  }

  .modal .check{
    width:60px; height:60px;
    background:#E9F8EF;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
  }

  .modal h2{ font-family:'Poppins', sans-serif; font-size:19px; margin-bottom:8px; }
  .modal p{ font-size:13.5px; color:var(--gray-600); line-height:1.6; margin-bottom:22px; }

  .modal button{
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:6px;
    padding:11px 22px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .modal button:hover{ background:var(--orange-dark); }
</style>
</head>
<body>

<div class="topbar">
  <a href="#" class="logo">
    <span class="mark">R</span>
    Richie<span class="store">Store</span>
  </a>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search cars, makes and more...">
    <button id="searchBtn" aria-label="Search">🔍</button>
  </div>

  <div class="top-actions">
    <a href="#" class="top-link"  style="font-weight: bold;">Welcome</a>
    <button class="cart-btn" id="cartBtn">
      <span class="cart-icon">🛒<span class="cart-count" id="cartCount">0</span></span>
      Cart
    </button>
  </div>
</div>

<a href="Main page.html"><div class="breadcrumb">Home &nbsp;›</a>&nbsp; Vehicles &nbsp;›&nbsp; <span class="current">Cars</span></div>

<div class="page">

  <aside class="filters">
    <h3>Filters</h3>

    <div class="filter-group">
      <h4>Make</h4>
      <div id="brandFilters"></div>
    </div>

    <div class="filter-group">
      <h4>Price range (₦)</h4>
      <div class="price-inputs">
        <input type="number" id="minPrice" placeholder="Min">
        <span>–</span>
        <input type="number" id="maxPrice" placeholder="Max">
      </div>
      <button class="apply-price" id="applyPrice">APPLY</button>
    </div>

    <button class="clear-filters" id="clearFilters">Clear all filters</button>
  </aside>

  <main class="main-col">
    <div class="results-bar">
      <h1>Cars <span class="count" id="resultsCount"></span></h1>
      <div class="sort-wrap">
        <label for="sortSelect">Sort:</label>
        <select id="sortSelect">
          <option value="popularity">Most popular</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest rated seller</option>
        </select>
      </div>
    </div>

    <div class="grid" id="productGrid"></div>
  </main>

</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h2>Your list</h2>
    <button class="drawer-close" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="cart-empty">Your list is empty. Add a car to get started.</div>
  </div>
  <div class="drawer-footer">
    <div class="subtotal-row">
      <span>Subtotal</span>
      <span id="subtotalVal">₦0</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" disabled>REQUEST TO BUY</button>
  </div>
</aside>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#1E8E4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>Request sent!</h2>
    <p id="modalText">Thanks for shopping with Richie Store. A seller will reach out to confirm your purchase.</p>
    <button id="modalClose">Continue browsing</button>
  </div>
</div>

<script>
(function(){
  const products = [
    {
      id:'c1', brand:'Toyota', name:'Toyota Camry (2018), Automatic', storage:'2018 · 48,000 km · Petrol · Automatic',
      price:11500000, originalPrice:13200000, rating:4.7, reviews:64,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/2018%20Toyota%20Camry.jpg?width=600'
    },
    {
      id:'c2', brand:'Toyota', name:'Toyota Corolla SE (2020), Automatic', storage:'2020 · 32,000 km · Petrol · Automatic',
      price:9800000, originalPrice:11000000, rating:4.6, reviews:89,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/2020%20Toyota%20Corolla%20SE.jpg?width=600'
    },
    {
      id:'c3', brand:'Toyota', name:'Toyota Highlander XLE AWD (2020)', storage:'2020 · 55,000 km · Petrol · Automatic',
      price:22000000, originalPrice:25500000, rating:4.8, reviews:37,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/2020%20Toyota%20Highlander%20XLE%20AWD%2C%20front.jpg?width=600'
    },
    {
      id:'c4', brand:'Toyota', name:'Toyota Sienna LE, 7-Seater', storage:'2011 · 92,000 km · Petrol · Automatic',
      price:7200000, originalPrice:8500000, rating:4.3, reviews:52,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/Toyota%20Sienna%20LE%20(6222546663).jpg?width=600'
    },
    {
      id:'c5', brand:'Honda', name:'Honda Accord 2.0T Touring (2018)', storage:'2018 · 61,000 km · Petrol · Automatic',
      price:10200000, originalPrice:11800000, rating:4.5, reviews:71,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/Honda%20Accord%202.0T%20Touring%202018%20(47575855671).jpg?width=600'
    },
    {
      id:'c6', brand:'Honda', name:'Honda CR-V EX i-VTEC (2019)', storage:'2019 · 44,000 km · Petrol · Automatic',
      price:16500000, originalPrice:18800000, rating:4.6, reviews:48,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/2019%20Honda%20CR-V%20EX%20i-VTEC%201.5.jpg?width=600'
    },
    {
      id:'c7', brand:'Lexus', name:'Lexus RX 350 (2023)', storage:'2023 · 18,000 km · Petrol · Automatic',
      price:38000000, originalPrice:42500000, rating:4.9, reviews:23,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/2023%20Lexus%20RX%20350%20(front).jpg?width=600'
    },
    {
      id:'c8', brand:'Mercedes-Benz', name:'Mercedes-Benz C-Class W205 (2016)', storage:'2016 · 71,000 km · Petrol · Automatic',
      price:14500000, originalPrice:16800000, rating:4.5, reviews:41,
      img:'https://commons.wikimedia.org/wiki/Special:FilePath/Mercedes-Benz%20C-Class%20W205%20JPN%20001.JPG?width=600'
    }
  ];

  const brands = [...new Set(products.map(p => p.brand))].sort();

  let activeBrands = new Set();
  let priceMin = null;
  let priceMax = null;
  let searchTerm = '';
  let sortBy = 'popularity';
  const cart = {};

  function naira(n){ return '₦' + n.toLocaleString('en-NG'); }
  function pct(price, original){ return Math.round((1 - price/original) * 100); }
  function starString(rating){
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  const brandFiltersEl = document.getElementById('brandFilters');
  brands.forEach(b => {
    const count = products.filter(p => p.brand === b).length;
    const label = document.createElement('label');
    label.className = 'filter-option';
    label.innerHTML = `<input type="checkbox" value="${b}"> ${b} <span class="count">(${count})</span>`;
    label.querySelector('input').addEventListener('change', e => {
      if(e.target.checked) activeBrands.add(b); else activeBrands.delete(b);
      render();
    });
    brandFiltersEl.appendChild(label);
  });

  document.getElementById('applyPrice').addEventListener('click', () => {
    const minVal = document.getElementById('minPrice').value;
    const maxVal = document.getElementById('maxPrice').value;
    priceMin = minVal ? Number(minVal) : null;
    priceMax = maxVal ? Number(maxVal) : null;
    render();
  });

  document.getElementById('clearFilters').addEventListener('click', () => {
    activeBrands.clear();
    priceMin = null; priceMax = null;
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
    document.getElementById('searchInput').value = '';
    searchTerm = '';
    brandFiltersEl.querySelectorAll('input').forEach(cb => cb.checked = false);
    document.getElementById('sortSelect').value = 'popularity';
    sortBy = 'popularity';
    render();
  });

  document.getElementById('sortSelect').addEventListener('change', e => {
    sortBy = e.target.value;
    render();
  });

  function doSearch(){
    searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    render();
  }
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  document.getElementById('searchInput').addEventListener('input', () => {
    if(document.getElementById('searchInput').value.trim() === ''){ searchTerm = ''; render(); }
  });

  function getVisibleProducts(){
    let list = products.filter(p => {
      if(activeBrands.size > 0 && !activeBrands.has(p.brand)) return false;
      if(priceMin !== null && p.price < priceMin) return false;
      if(priceMax !== null && p.price > priceMax) return false;
      if(searchTerm && !(p.name.toLowerCase().includes(searchTerm) || p.brand.toLowerCase().includes(searchTerm))) return false;
      return true;
    });

    if(sortBy === 'price-asc') list.sort((a,b) => a.price - b.price);
    else if(sortBy === 'price-desc') list.sort((a,b) => b.price - a.price);
    else if(sortBy === 'rating') list.sort((a,b) => b.rating - a.rating);
    else list.sort((a,b) => b.reviews - a.reviews);

    return list;
  }

  const grid = document.getElementById('productGrid');
  const resultsCount = document.getElementById('resultsCount');

  function render(){
    const list = getVisibleProducts();
    resultsCount.textContent = `(${list.length} result${list.length === 1 ? '' : 's'})`;
    grid.innerHTML = '';

    if(list.length === 0){
      grid.innerHTML = '<div class="no-results">No cars match your filters. Try clearing some filters.</div>';
      return;
    }

    list.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      const discount = pct(p.price, p.originalPrice);
      const inCart = !!cart[p.id];
      card.innerHTML = `
        <span class="badge">-${discount}%</span>
        <div class="card-img"><img src="${p.img}" alt="${p.brand} ${p.name}" loading="lazy"></div>
        <div class="brand">${p.brand}</div>
        <div class="name">${p.name}</div>
        <div class="rating-row"><span class="stars">${starString(p.rating)}</span><span class="reviews">(${p.reviews} seller reviews)</span></div>
        <div class="price-row">
          <span class="price-now">${naira(p.price)}</span>
          <span class="price-was">${naira(p.originalPrice)}</span>
        </div>
        <div class="storage-tag">${p.storage}</div>
        <button class="add-btn ${inCart ? 'added' : ''}" data-id="${p.id}">${inCart ? 'ADDED ✓' : 'ADD TO LIST'}</button>
      `;
      card.querySelector('.add-btn').addEventListener('click', (e) => {
        addToCart(p.id);
        e.target.textContent = 'ADDED ✓';
        e.target.classList.add('added');
      });
      grid.appendChild(card);
    });
  }

  const cartCountEl = document.getElementById('cartCount');
  const drawerBody = document.getElementById('drawerBody');
  const subtotalVal = document.getElementById('subtotalVal');
  const checkoutBtn = document.getElementById('checkoutBtn');

  function addToCart(id){
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
  }

  function changeQty(id, delta){
    cart[id] = (cart[id] || 0) + delta;
    if(cart[id] <= 0) delete cart[id];
    renderCart();
    render();
  }

  function removeFromCart(id){
    delete cart[id];
    renderCart();
    render();
  }

  function renderCart(){
    const ids = Object.keys(cart);
    const totalCount = ids.reduce((sum, id) => sum + cart[id], 0);
    cartCountEl.textContent = totalCount;

    if(ids.length === 0){
      drawerBody.innerHTML = '<div class="cart-empty">Your list is empty. Add a car to get started.</div>';
      subtotalVal.textContent = naira(0);
      checkoutBtn.disabled = true;
      return;
    }

    let subtotal = 0;
    drawerBody.innerHTML = '';
    ids.forEach(id => {
      const p = products.find(x => x.id === id);
      const qty = cart[id];
      subtotal += p.price * qty;

      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <div class="cart-item-info">
          <div class="name">${p.brand} ${p.name}</div>
          <div class="price">${naira(p.price)}</div>
          <div class="qty-row">
            <button class="qty-btn" data-action="dec">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-action="inc">+</button>
            <button class="remove-btn" data-action="remove">Remove</button>
          </div>
        </div>
      `;
      row.querySelector('[data-action="dec"]').addEventListener('click', () => changeQty(id, -1));
      row.querySelector('[data-action="inc"]').addEventListener('click', () => changeQty(id, 1));
      row.querySelector('[data-action="remove"]').addEventListener('click', () => removeFromCart(id));
      drawerBody.appendChild(row);
    });

    subtotalVal.textContent = naira(subtotal);
    checkoutBtn.disabled = false;
  }

  const overlay = document.getElementById('overlay');
  const drawer = document.getElementById('cartDrawer');

  function openDrawer(){
    overlay.classList.add('open');
    drawer.classList.add('open');
  }
  function closeDrawerFn(){
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  }

  document.getElementById('cartBtn').addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawerFn);
  overlay.addEventListener('click', () => { closeDrawerFn(); closeModal(); });

  const modalOverlay = document.getElementById('modalOverlay');
  const modalText = document.getElementById('modalText');

  function openModal(){
    const itemCount = Object.values(cart).reduce((a,b) => a+b, 0);
    modalText.textContent = `Thanks for shopping with Richie Store. Your request for ${itemCount} vehicle${itemCount === 1 ? '' : 's'} (${subtotalVal.textContent}) has been sent. A seller will reach out to confirm your purchase.`;
    modalOverlay.classList.add('open');
  }
  function closeModal(){ modalOverlay.classList.remove('open'); }

  checkoutBtn.addEventListener('click', () => {
    if(checkoutBtn.disabled) return;
    const whatsappNumber = '2349159214310';
    const formatNaira = new Intl.NumberFormat('en-NG', {
      style: 'currency',
      currency: 'NGN',
      maximumFractionDigits: 0
    });
    const lines = ['Hello Richie Store, I would like to place this order:'];
    let subtotal = 0;

    Object.keys(cart).forEach(id => {
      const product = products.find(item => item.id === id);
      const quantity = cart[id];
      if(!product || !Number.isInteger(quantity) || quantity < 1) return;

      const lineTotal = product.price * quantity;
      subtotal += lineTotal;
      lines.push(
        '',
        `${product.brand || product.category || ''} ${product.name}`.trim(),
        `Details: ${product.storage || product.size || 'Standard'}`,
        `Quantity: ${quantity}`,
        `Unit price: ${formatNaira.format(product.price)}`,
        `Line total: ${formatNaira.format(lineTotal)}`
      );
    });

    if(subtotal <= 0) return;

    lines.push(
      '',
      `Order subtotal: ${formatNaira.format(subtotal)}`,
      '',
      'Please confirm availability, delivery cost, and payment details.',
      'My name, phone number, and delivery address:'
    );

    const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`;
    window.location.assign(whatsappUrl);
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);

  render();
  renderCart();
})();
</script>
</body>
</html>
